<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara de Seguridad Ultra-Compatible</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; padding: 20px; }
        h1 { color: #00adb5; }
        video { width: 100%; max-width: 500px; border: 3px solid #00adb5; background: black; border-radius: 8px; margin-top: 10px; }
        .btn { background: #00adb5; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 10px; width: 80%; max-width: 300px; }
        .info { background: #222831; padding: 15px; border-radius: 5px; margin: 20px auto; max-width: 400px; word-wrap: break-word; }
    </style>
</head>
<body>

    <h1>Monitoreo Residencial</h1>

    <!-- SECCIÓN ÚNICA PARA LA TABLET -->
    <div id="pantalla-tablet">
        <p>Paso 1: Presiona el botón para activar la cámara en esta tablet vieja.</p>
        <button class="btn" onclick="iniciarCamaraFija()">ENCENDER CÁMARA</button>
        <div class="info">
            <p><strong>ESTADO:</strong> <span id="estado-conexion" style="color: #ff2e63;">Apagada</span></p>
        </div>
        <video id="local-video" autoplay playsinline muted></video>
    </div>

    <script>
        let localStream;
        // Forzamos un ID fijo y ultra simple que no requiera generación aleatoria
        const ID_FIJO_CAMARA = "camara-huawei-casa"; 
        
        function iniciarCamaraFija() {
            document.getElementById('estado-conexion').innerText = "Conectando al servidor...";
            document.getElementById('estado-conexion').style.color = "#ffb400";

            // Forzamos la conexión con parámetros básicos tolerantes a redes viejas
            const peer = new Peer(ID_FIJO_CAMARA, {
                debug: 2
            });

            peer.on('open', (id) => {
                document.getElementById('estado-conexion').innerText = "CÁMARA LISTA Y EMITIENDO";
                document.getElementById('estado-conexion').style.color = "#00ff66";
            });

            peer.on('error', (err) => {
                // Si el ID fijo ya está en uso por error, lo limpia y reintenta
                if(err.type === 'unavailable-id') {
                    document.getElementById('estado-conexion').innerText = "El ID ya está activo, lista para recibir conexión.";
                    document.getElementById('estado-conexion').style.color = "#00ff66";
                } else {
                    alert("Error de conexión: " + err.type);
                }
            });

            // Soporte universal de cámara para Android Antiguo
            const opcionesCamara = { 
                video: true, 
                audio: false // Desactivamos audio para reducir consumo de datos y evitar bloqueos de permisos viciados
            };

            navigator.mediaDevices = navigator.mediaDevices || {};
            navigator.mediaDevices.getUserMedia = navigator.mediaDevices.getUserMedia || function(constraints) {
                let getUserMedia = navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
                if (!getUserMedia) {
                    return Promise.reject(new Error('getUserMedia no está soportado en este navegador viejo'));
                }
                return new Promise(function(resolve, reject) {
                    getUserMedia.call(navigator, constraints, resolve, reject);
                });
            }

            navigator.mediaDevices.getUserMedia(opcionesCamara)
            .then((stream) => {
                localStream = stream;
                const videoElement = document.getElementById('local-video');
                if ('srcObject' in videoElement) {
                    videoElement.srcObject = stream;
                } else {
                    videoElement.src = window.URL.createObjectURL(stream);
                }
            })
            .catch((err) => {
                alert("No se pudo abrir el lente de la cámara: " + err.message);
            });

            // Responder cuando el celular Samsung llame
            peer.on('call', (call) => {
                call.answer(localStream);
            });
        }
    </script>
</body>
</html>
